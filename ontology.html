<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>강점 네트워크 (프로토타입) | 이재중</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: radial-gradient(130% 100% at 50% 14%, #12241e 0%, #0b100e 52%, #070a09 100%);
    color: #e6ebe8; font-family: "Pretendard Variable", Pretendard, sans-serif; min-height: 100vh; overflow-x: hidden; padding-bottom: 36px; }
  .head { text-align: center; padding: 24px 20px 2px; position: relative; z-index: 3; }
  .head .eyebrow { font-size: 0.78rem; letter-spacing: 0.2em; color: #34d399; font-weight: 700; text-transform: uppercase; }
  .head h1 { font-size: clamp(1.4rem, 4vw, 2rem); font-weight: 800; margin-top: 10px; letter-spacing: -0.02em; }
  .head p { color: #8ba39a; margin-top: 9px; font-size: 0.9rem; padding: 0 16px; word-break: keep-all; }
  .head p.thesis { color: #b9c4bf; margin-top: 7px; font-size: 0.88rem; }
  .head p.thesis b { color: #f4c86a; font-weight: 800; }
  .legend { display: flex; gap: 14px 18px; justify-content: center; flex-wrap: wrap; margin: 14px auto 0; position: relative; z-index: 3; font-size: 0.82rem; padding: 0 16px; }
  .legend span { display: inline-flex; align-items: center; gap: 7px; color: #b9c4bf; }
  .legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .legend small { color: #6e7f78; font-size: 0.76rem; }
  .legend i.ring { background: transparent; border: 1.5px solid #f4c86a; width: 9px; height: 9px; }
  .stage { position: relative; width: 100%; max-width: 760px; margin: 4px auto 0; touch-action: manipulation; }
  #neb { position: absolute; inset: 0; z-index: 0;
    -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 62%, transparent 100%);
            mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 62%, transparent 100%); }
  #net { position: absolute; inset: 0; z-index: 1; }
  .edge { stroke-width: 1.4; opacity: 0.35; stroke-linecap: round; }
  .node { cursor: pointer; }
  .node circle.ring { stroke-width: 1.8; }
  .node circle.halo { fill: none; stroke-width: 1; stroke-dasharray: 2 7; stroke-linecap: round; opacity: .55; pointer-events: none; }
  .node:hover circle.ring, .node:focus circle.ring { stroke-width: 2.6; }
  .node .lbl { fill: #f4f8f6; font-weight: 800; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .node .en { text-anchor: middle; dominant-baseline: central; font-weight: 600; pointer-events: none; opacity: .8; }
  .node .bar { }
  .node.dim { opacity: .3; }
  .cap { max-width: 620px; margin: 2px auto 0; min-height: 96px; padding: 18px 22px; text-align: center; position: relative; z-index: 3;
    border-radius: 16px; border: 1px solid transparent; background: transparent; transition: background .2s, border-color .2s; }
  .cap.has-projs { background: rgba(20,36,30,0.72); border-color: #234238; }
  .cap .ck { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
  .cap .ct { font-size: 1.05rem; font-weight: 800; margin-top: 3px; }
  .cap .cd { color: #b9c4bf; margin-top: 8px; font-size: 0.92rem; word-break: keep-all; line-height: 1.6; }
  .cap .hint { color: #6e7f78; font-size: 0.88rem; }
  .cap-projs-label { color: #6e9f8c; font-size: 0.74rem; font-weight: 700; letter-spacing: 0.04em; margin-top: 14px; }
  .cap-projs { display: flex; flex-wrap: wrap; gap: 9px; justify-content: center; margin-top: 8px; }
  .cap-proj { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; font-size: 0.88rem; font-weight: 700; color: #0b100e; text-decoration: none;
    border: 1px solid #34d399; background: #34d399; padding: 8px 16px; border-radius: 999px; transition: transform .15s, background .15s, box-shadow .15s; }
  .cap-proj:hover, .cap-proj:focus-visible { background: #4be3ac; transform: translateY(-1px); box-shadow: 0 4px 14px rgba(52,211,153,0.35); }
</style>
</head>
<body>
  <div class="head">
    <div class="eyebrow">이재중 · Strength Network</div>
    <h1>이재중의 강점 네트워크</h1>
    <p>진단으로 검증된 이재중의 대표 강점을 중심으로, 다섯 가지 실무 강점이 함께 돕니다.</p>
    <p class="thesis">이 강점들을 관통하는 한 단어 — <b>번역</b>. 현장의 필요를 변화의 언어로 옮깁니다.</p>
  </div>
  <div class="legend">
    <span><i style="background:#f4c86a"></i>대표 강점 <small>· 태니지먼트 진단 2026.07</small></span>
    <span><i class="ring"></i>6대 재능 <small>· 안쪽 궤도</small></span>
    <span><i style="background:#34d399"></i>실무 강점</span>
  </div>

  <div class="stage" id="stage">
    <canvas id="neb"></canvas>
    <svg id="net" xmlns="http://www.w3.org/2000/svg"><g id="edges"></g><g id="nodes"></g></svg>
  </div>

  <div class="cap" id="cap"><div class="hint">💡 마우스를 올리면(모바일: 탭) 회전이 멈추고 상세가 나타납니다</div></div>

<script>
const AMBER=[244,200,106], TEAL=[52,211,153];
const HUB = { id:"core", ko:"창조·탐구", en:"Create · Explore", rgb:AMBER, s:"#f4c86a",
  ev:"태니지먼트 진단 대표 강점 — 새롭게 제안하고(창조) 깊이 파고들어 해결하는(탐구) 사람입니다. 안쪽 궤도의 별은 같은 진단에서 나온 6대 재능(창의·정보수집·양성·행동·비교·효율)입니다.",
  projects:[{slug:"matzip",t:"맛집 평점 보정"},{slug:"hangul-catch",t:"한글 캐치"},{slug:"yeolmae-hackathon",t:"해커톤 허브"}] };
const ORBIT = [
  { id:"plan",    ko:"기획",   en:"Plan",    ev:"신청·심사·매뉴얼·데이터센터 등 거의 모든 프로젝트를 직접 기획했습니다.",
    projects:[{slug:"yeolmae-apply",t:"신청·심사 시스템"},{slug:"smartwork-manual",t:"매뉴얼 웹서비스"},{slug:"data-center",t:"데이터 센터"}] },
  { id:"build",   ko:"제작",   en:"Build",   ev:"기획에 그치지 않고 20개 프로젝트를 직접 만들었습니다.",
    projects:[{slug:"yeolmae-apply",t:"신청·심사 시스템"},{slug:"attendance",t:"QR 출석 시스템"},{slug:"data-center",t:"데이터 센터"}] },
  { id:"operate", ko:"운영",   en:"Operate", ev:"출석 시스템을 매 행사마다 상시 운영하고, 신청·심사를 실제 운영했습니다.",
    projects:[{slug:"attendance",t:"QR 출석 시스템"},{slug:"yeolmae-apply",t:"신청·심사 시스템"}] },
  { id:"tech",    ko:"AI·자동화", en:"AI · Automation", ev:"Codex→Claude Code로 제작, 해커톤 Gemini 심사, QR 출석·정산 자동화.",
    projects:[{slug:"ai-blog",t:"AI 블로그 자동화"},{slug:"yeolmae-hackathon",t:"해커톤(Gemini 심사)"},{slug:"attendance",t:"QR 자동화"},{slug:"matzip",t:"맛집 알고리즘"}] },
  { id:"people",  ko:"콘텐츠·사람", en:"Content · People", ev:"후원 캠페인 영상, 어르신 영상 자서전, 일상도 로컬 큐레이션 — 사람을 향한 콘텐츠.",
    projects:[{slug:"welfare-content",t:"콘텐츠·홍보 기획"},{slug:"ilsangdo",t:"일상도"}] },
];
ORBIT.forEach((n,i)=>{ n.base = -Math.PI/2 + i*(2*Math.PI/ORBIT.length); n.rgb=TEAL; n.s="#34d399";
  n.parts = Array.from({length:40},()=>({ang:Math.random()*6.283,dist:0.75+Math.random()*1.7,sz:Math.random()*1.5+0.35,tw:Math.random()*6.283,ts:Math.random()*0.03+0.006,orb:(Math.random()*0.0015+0.0004)*(Math.random()<0.5?-1:1)})); });
HUB.parts = Array.from({length:70},()=>({ang:Math.random()*6.283,dist:0.75+Math.random()*1.8,sz:Math.random()*1.7+0.45,tw:Math.random()*6.283,ts:Math.random()*0.03+0.006,orb:(Math.random()*0.0012+0.0003)*(Math.random()<0.5?-1:1)}));
const TALENTS = ["창의","정보수집","양성","행동","비교","효율"].map((ko,i,a)=>({ko, base: i*(2*Math.PI/a.length)}));
const ALL = [HUB, ...ORBIT];
const byId = Object.fromEntries(ALL.map(n=>[n.id,n]));

const SVGNS="http://www.w3.org/2000/svg";
const stage=document.getElementById("stage"), svg=document.getElementById("net");
const edgesG=document.getElementById("edges"), nodesG=document.getElementById("nodes");
const cap=document.getElementById("cap"), canvas=document.getElementById("neb"), ctx=canvas.getContext("2d");
const reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches;

// 유리구슬 그라데이션·빛번짐·연결선 그라데이션 정의
const defs=document.createElementNS(SVGNS,"defs");
defs.innerHTML=
  '<radialGradient id="gHub" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#ffe7a8" stop-opacity=".55"/><stop offset=".45" stop-color="#5a4314" stop-opacity=".8"/><stop offset="1" stop-color="#0d0f0b" stop-opacity=".95"/></radialGradient>'+
  '<radialGradient id="gOrb" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#8ff5cf" stop-opacity=".42"/><stop offset=".5" stop-color="#0f3a2c" stop-opacity=".82"/><stop offset="1" stop-color="#06100c" stop-opacity=".95"/></radialGradient>'+
  '<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>'+
  ORBIT.map(n=>'<linearGradient id="eg-'+n.id+'" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f4c86a"/><stop offset="1" stop-color="#34d399"/></linearGradient>').join("");
svg.insertBefore(defs, svg.firstChild);
const edgeEls = ORBIT.map(n=>{ const l=document.createElementNS(SVGNS,"line"); l.setAttribute("class","edge"); l.setAttribute("stroke","url(#eg-"+n.id+")"); l.dataset.id=n.id; edgesG.appendChild(l); n.grad=defs.querySelector("#eg-"+n.id); return l; });
ALL.forEach(n=>{
  const g=document.createElementNS(SVGNS,"g"); g.setAttribute("class","node"); g.setAttribute("tabindex","0"); g.setAttribute("role","button"); g.setAttribute("aria-label",n.ko); g.dataset.id=n.id;
  n.g=g; n.ring=document.createElementNS(SVGNS,"circle"); n.ring.setAttribute("class","ring"); n.ring.setAttribute("stroke",n.s);
  n.ring.setAttribute("fill", n===HUB ? "url(#gHub)" : "url(#gOrb)"); n.ring.setAttribute("filter","url(#glow)");
  n.halo=document.createElementNS(SVGNS,"circle"); n.halo.setAttribute("class","halo"); n.halo.setAttribute("stroke",n.s);
  n.lbl=document.createElementNS(SVGNS,"text"); n.lbl.setAttribute("class","lbl"); n.lbl.textContent=n.ko;
  n.enEl=document.createElementNS(SVGNS,"text"); n.enEl.setAttribute("class","en"); n.enEl.setAttribute("fill",n.s); n.enEl.textContent=n.en;
  n.bar=document.createElementNS(SVGNS,"rect"); n.bar.setAttribute("fill",n.s); n.bar.setAttribute("rx","1.5");
  g.append(n.halo,n.ring,n.lbl,n.enEl,n.bar); nodesG.appendChild(g);
  const act=()=>{ paused=true; select(n.id); };
  g.addEventListener("mouseenter",act); g.addEventListener("focus",act); g.addEventListener("click",e=>{e.stopPropagation();act();});
  g.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();act();} });
});

let W=0,H=0,CX=0,CY=0,rx=0,ry=0,hubR=0,orbR=0,rot=0,paused=false,active=null,MOBILE=false,T=0,ryNow=0,cxNow=0,cyNow=0;
function layout(){
  W=stage.clientWidth; const mobile=W<560;
  H=mobile?Math.min(W*1.02,450):Math.min(W*0.6,470);
  stage.style.height=H+"px";
  const dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=W*dpr; canvas.height=H*dpr; canvas.style.width=W+"px"; canvas.style.height=H+"px"; ctx.setTransform(dpr,0,0,dpr,0,0);
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`); svg.setAttribute("width",W); svg.setAttribute("height",H);
  CX=W/2; CY=H*0.5; rx=Math.min(W*(mobile?0.33:0.35),340); ry=mobile?H*0.33:Math.min(rx*0.56,H*0.34);
  hubR=Math.max(mobile?38:46, Math.min(W,H)*0.105); orbR=Math.max(mobile?26:31, Math.min(W,H)*0.07);
  MOBILE=mobile;
  HUB.x=CX; HUB.y=CY; HUB.r=hubR; HUB.scale=1;
  seedBg();
}
let mx=0,my=0,tmx=0,tmy=0;
function place(){
  mx+=(tmx-mx)*0.05; my+=(tmy-my)*0.05;
  const par=Math.min(W,H)*0.035;
  const cx=CX+mx*par, cy=CY+my*par;
  const ryD=ry*(MOBILE?1:(0.62+((my+1)/2)*0.62));
  HUB.x=cx; HUB.y=cy; HUB.r=hubR; HUB.scale=1; cxNow=cx; cyNow=cy; ryNow=ryD;
  ORBIT.forEach(n=>{ const a=n.base+rot; n.x=cx+rx*Math.cos(a); n.y=cy+ryD*Math.sin(a);
    const d=(Math.sin(a)+1)/2; n.d=d; n.scale=0.7+d*0.5; n.op=0.5+d*0.5; n.r=orbR*n.scale; });
}
function paint(){
  [HUB,...ORBIT].forEach(n=>{
    const e=n; const sc=n===HUB?1:n.scale; const op=n===HUB?1:n.op;
    e.ring.setAttribute("cx",n.x); e.ring.setAttribute("cy",n.y); e.ring.setAttribute("r",n.r);
    e.ring.setAttribute("stroke-width", (n===HUB?2.2:1.8)*sc);
    e.g.style.opacity = (active && active!==n.id && !(n.id==="core"&&active) && !(n===HUB)) ? op*0.9 : op;
    // 글자가 원 안에 들어가도록 길이에 맞춰 크기 조절
    const inner=n.r*1.62;
    const fsKo=Math.max(10, Math.min(n.r*(n===HUB?0.36:0.46), inner/(n.ko.length*0.98)));
    const fsEn=Math.max(7, Math.min(n.r*0.22, inner/(n.en.length*0.56)));
    e.lbl.setAttribute("x",n.x); e.lbl.setAttribute("y",n.y-n.r*0.14); e.lbl.setAttribute("font-size",fsKo);
    e.enEl.setAttribute("x",n.x); e.enEl.setAttribute("y",n.y+n.r*0.4); e.enEl.setAttribute("font-size",fsEn);
    e.halo.setAttribute("cx",n.x); e.halo.setAttribute("cy",n.y); e.halo.setAttribute("r",n.r*1.2);
    e.halo.style.strokeDashoffset = (n===HUB?-1:1)*T*0.35;
    e.halo.style.opacity = (active===n.id||n===HUB) ? 0.85 : 0.4;
    const bw=n.r*0.85; e.bar.setAttribute("x",n.x-bw/2); e.bar.setAttribute("y",n.y+n.r+6*sc); e.bar.setAttribute("width",bw); e.bar.setAttribute("height",3);
  });
  edgeEls.forEach(l=>{ const n=byId[l.dataset.id]; l.setAttribute("x1",HUB.x); l.setAttribute("y1",HUB.y); l.setAttribute("x2",n.x); l.setAttribute("y2",n.y);
    n.grad.setAttribute("x1",HUB.x); n.grad.setAttribute("y1",HUB.y); n.grad.setAttribute("x2",n.x); n.grad.setAttribute("y2",n.y);
    l.style.opacity = active? (active===n.id?1:0.12) : (0.28+n.d*0.4); l.style.strokeWidth = active===n.id?2.4:1.4; });
  const back=ORBIT.filter(n=>n.d<0.5).sort((a,b)=>a.d-b.d);
  const front=ORBIT.filter(n=>n.d>=0.5).sort((a,b)=>a.d-b.d);
  back.forEach(n=>nodesG.appendChild(n.g)); nodesG.appendChild(HUB.g); front.forEach(n=>nodesG.appendChild(n.g));
}
let bg=[];
function seedBg(){ bg=Array.from({length:Math.round(W*H/13000)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.1+0.2,tw:Math.random()*6.283,ts:Math.random()*0.02+0.004})); }
// 연결선 위를 흐르는 빛 알갱이
const pulses=[]; let spawnAcc=0;
function lerp(a,b,t){ return a+(b-a)*t; }
function neb(){
  ctx.clearRect(0,0,W,H);
  if(!reduced) T+=1;
  // 오로라: 크고 옅은 빛 세 덩이가 천천히 움직임
  [[0.28,0.32,"52,211,153",0.10,0.0007],[0.74,0.62,"244,200,106",0.07,0.0005],[0.5,0.85,"40,170,190",0.07,0.0009]].forEach(([bx,by,c,al,sp],i)=>{
    const x=W*(bx+Math.sin(T*sp+i)*0.06), y=H*(by+Math.cos(T*sp*1.3+i)*0.06), R=Math.max(W,H)*0.45;
    const g=ctx.createRadialGradient(x,y,0,x,y,R); g.addColorStop(0,"rgba("+c+","+al+")"); g.addColorStop(1,"rgba("+c+",0)");
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H); });
  // 바깥 궤도 점선
  ctx.save(); ctx.setLineDash([2,9]); ctx.lineDashOffset=-T*0.3; ctx.strokeStyle="rgba(52,211,153,0.16)"; ctx.lineWidth=1;
  ctx.beginPath(); ctx.ellipse(cxNow,cyNow,rx,ryNow,0,0,6.283); ctx.stroke();
  // 안쪽 궤도(6대 재능)
  ctx.strokeStyle="rgba(244,200,106,0.13)"; ctx.beginPath(); ctx.ellipse(cxNow,cyNow,rx*0.52,ryNow*0.64,0,0,6.283); ctx.stroke(); ctx.restore();
  // 중심의 잔물결
  for(let i=0;i<3;i++){ const k=((T*0.006)+i/3)%1; const rr=HUB.r*(1.05+k*1.5);
    ctx.beginPath(); ctx.arc(HUB.x,HUB.y,rr,0,6.283); ctx.strokeStyle="rgba(244,200,106,"+(0.28*(1-k))+")"; ctx.lineWidth=1.2; ctx.stroke(); }
  // 6대 재능 별 (반대 방향으로 천천히)
  ctx.font="600 11px 'Pretendard Variable', Pretendard, sans-serif"; ctx.textAlign="center"; ctx.textBaseline="top";
  TALENTS.forEach(t=>{ const a=t.base-rot*1.6+0.3; const x=cxNow+rx*0.52*Math.cos(a), y=cyNow+ryNow*0.64*Math.sin(a); const d=(Math.sin(a)+1)/2;
    const al=(active&&active!=="core")?0.25:(0.45+d*0.55); const rr=2.2+d*1.6;
    const g=ctx.createRadialGradient(x,y,0,x,y,rr*4); g.addColorStop(0,"rgba(255,226,150,"+(0.55*al)+")"); g.addColorStop(1,"rgba(255,226,150,0)");
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,rr*4,0,6.283); ctx.fill();
    ctx.fillStyle="rgba(255,236,190,"+al+")"; ctx.beginPath(); ctx.arc(x,y,rr,0,6.283); ctx.fill();
    if(!MOBILE||active==="core"){ ctx.fillStyle="rgba(244,214,150,"+(al*0.9)+")"; ctx.fillText(t.ko,x,y+rr+4); } });
  // 빛 알갱이: 중심에서 강점으로 흘러감
  if(!reduced){ spawnAcc+=active?0.09:0.045; while(spawnAcc>=1){ spawnAcc-=1; const n=active&&active!=="core"&&Math.random()<0.7?byId[active]:ORBIT[(Math.random()*ORBIT.length)|0]; pulses.push({n,t:0,sp:0.006+Math.random()*0.006}); } }
  for(let i=pulses.length-1;i>=0;i--){ const p=pulses[i]; p.t+=p.sp*(active===p.n.id?1.8:1); if(p.t>=1){ pulses.splice(i,1); continue; }
    const x=lerp(HUB.x,p.n.x,p.t), y=lerp(HUB.y,p.n.y,p.t); const c=[lerp(244,52,p.t)|0,lerp(200,211,p.t)|0,lerp(106,153,p.t)|0];
    const fade=Math.sin(p.t*Math.PI)*(active&&active!==p.n.id?0.25:1); const R=active===p.n.id?7:5;
    const g=ctx.createRadialGradient(x,y,0,x,y,R); g.addColorStop(0,"rgba("+c+","+(0.95*fade)+")"); g.addColorStop(1,"rgba("+c+",0)");
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,R,0,6.283); ctx.fill(); }
  for(const s of bg){ s.tw+=s.ts; const a=(0.3+Math.abs(Math.sin(s.tw))*0.5)*0.4; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.283); ctx.fillStyle="rgba(90,190,155,"+a+")"; ctx.fill(); }
  const list=[...ORBIT].sort((a,b)=>a.d-b.d); list.splice(list.findIndex(n=>n.d>=0.5)<0?list.length:list.findIndex(n=>n.d>=0.5),0,HUB);
  for(const n of list){ const [r,g,b]=n.rgb; const sc=n===HUB?1:n.scale; const dim=active&&active!==n.id; const boost=active===n.id?1.6:1;
    for(const p of n.parts){ if(!reduced){ p.ang+=p.orb; p.tw+=p.ts; } const rad=p.dist*n.r; const x=n.x+Math.cos(p.ang)*rad,y=n.y+Math.sin(p.ang)*rad;
      const a=(0.3+Math.abs(Math.sin(p.tw))*0.6)*(dim?0.14:0.75)*boost*(n===HUB?1:n.op); ctx.beginPath(); ctx.arc(x,y,p.sz*sc,0,6.283); ctx.fillStyle="rgba("+r+","+g+","+b+","+a+")"; ctx.fill(); }
    const gr=ctx.createRadialGradient(n.x,n.y,n.r*0.4,n.x,n.y,n.r*2.3); const ga=(dim?0.06:0.24)*boost*(n===HUB?1:n.op);
    gr.addColorStop(0,"rgba("+r+","+g+","+b+","+ga+")"); gr.addColorStop(1,"rgba("+r+","+g+","+b+",0)");
    ctx.beginPath(); ctx.arc(n.x,n.y,n.r*2.3,0,6.283); ctx.fillStyle=gr; ctx.fill(); }
}
function render(){ place(); paint(); neb(); }
function frame(){ if(!paused&&!reduced) rot += 0.0022 + mx*0.0032; render(); requestAnimationFrame(frame); }

function renderCap(id){ const n=byId[id]; const K = n===HUB?["대표 강점 · 태니지먼트 진단","#f4c86a"]:["실무 강점","#34d399"];
  const has = n.projects&&n.projects.length;
  let pj=''; if(has){ pj='<div class="cap-projs-label">관련 프로젝트 보기</div><div class="cap-projs">'+n.projects.map(p=>'<a class="cap-proj" target="_top" href="project.html?slug='+p.slug+'">'+p.t+' →</a>').join('')+'</div>'; }
  cap.classList.toggle("has-projs", !!has);
  cap.innerHTML='<div class="ck" style="color:'+K[1]+'">'+K[0]+'</div><div class="ct" style="color:'+K[1]+'">'+n.ko+' · '+n.en+'</div><div class="cd">'+n.ev+'</div>'+pj; }
function clearCap(){ cap.classList.remove("has-projs"); cap.innerHTML='<div class="hint">💡 마우스를 올리면(모바일: 탭) 회전이 멈추고, 강점의 실제 프로젝트가 나타납니다</div>'; }
function select(id){ paused=true; active=id; renderCap(id); }
stage.addEventListener("mouseleave",()=>{ paused=false; active=null; tmx=0; tmy=0; });
stage.addEventListener("mousemove",e=>{ const r=stage.getBoundingClientRect(); tmx=((e.clientX-r.left)/r.width-0.5)*2; tmy=((e.clientY-r.top)/r.height-0.5)*2; });
stage.addEventListener("click",e=>{ if(e.target===stage||e.target===canvas||e.target===svg){ paused=false; active=null; clearCap(); } });

function reportH(){ try{ if(window.parent!==window) window.parent.postMessage({ontoH: Math.ceil(document.body.getBoundingClientRect().height)}, "*"); }catch(e){} }
// 설명 상자는 노드마다 길이가 달라, 가장 긴 경우의 높이를 미리 잡아 둔다
// (hover 때마다 페이지가 들썩이거나 iframe 아래가 잘리지 않도록)
function reserveCap(){
  const keep=cap.innerHTML, had=cap.classList.contains("has-projs");
  cap.style.minHeight="0px"; let max=0;
  ALL.forEach(n=>{ renderCap(n.id); max=Math.max(max,cap.offsetHeight); });
  cap.innerHTML=keep; cap.classList.toggle("has-projs",had);
  cap.style.minHeight=max+"px";
}
let rt; window.addEventListener("resize",()=>{ clearTimeout(rt); rt=setTimeout(()=>{ layout(); render(); reserveCap(); reportH(); },120); });
function boot(){ layout(); render(); reserveCap(); reportH(); }
// 글꼴 로딩 등으로 높이가 바뀌어도 부모에 다시 알림
if (window.ResizeObserver) new ResizeObserver(()=>reportH()).observe(document.body);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ reserveCap(); reportH(); });
setTimeout(()=>{ boot(); requestAnimationFrame(frame); setTimeout(reportH,700); },50);
// lazy iframe이 화면 밖에서 로드되면 stage 크기를 못 재 높이가 0으로 굳는다.
// 폭이 잡혔는데 높이가 0이면 다시 계산한다(초기 몇 초간 확인 + 리사이즈 감지).
let fixTries = 0;
const fixTimer = setInterval(()=>{
  if (stage.clientWidth > 0 && stage.clientHeight === 0) { boot(); }
  if (stage.clientHeight > 0 || ++fixTries > 40) clearInterval(fixTimer);
}, 150);
if (window.ResizeObserver) {
  new ResizeObserver(()=>{ if (stage.clientWidth > 0 && stage.clientHeight === 0) boot(); }).observe(stage);
}
</script>
